name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*' # semver tag

permissions:
  id-token: write
  contents: read

jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup runtime
      - uses: pnpm/setup@v3
        with:
          version: ^12
          runtime: node@24

      # Setup
      - name: Setup package
        run: |
          node scripts/src/setup.mts
          pnpm i

      # Build
      - name: Build
        run: node --run build

      # Publish
      - name: Publish
        run: pnpm stage publish ./dist
