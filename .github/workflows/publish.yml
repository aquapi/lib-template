name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*' # semver tag

permissions:
  id-token: write
  contents: read

jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup runtime
      - uses: oven-sh/setup-node@v7
        with:
          node-version: '26.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Setup
      - name: Setup package
        run: |
          node --run setup
          npm i

      # Build
      - name: Build
        run: node --run build

      # Publish
      - name: Publish
        run: npm stage publish ./dist
