name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*' # semver tag

permissions:
  id-token: write
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ['lts', 'latest']

    name: Test with Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: unjs/setup-jup@85aa1e9e4cd2995fba3bee414cde74bf88637a2c
        with:
          node-version: ${{ matrix.node-version }}
          package-managers: upm

      - name: Setup package
        run: |
          node scripts/src/setup.mts
          upm i
          node --run build

      - name: Test
        run: node --run test

  Publish:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: unjs/setup-jup@85aa1e9e4cd2995fba3bee414cde74bf88637a2c
        with:
          node-version: lts
          package-managers: upm

      - name: Setup package
        run: |
          node scripts/src/setup.mts
          upm i
          node --run build

      - name: Publish
        run: upm stage publish ./dist
