name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*' # semver tag

permissions:
  id-token: write
  contents: read

jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup runtime
      - uses: oven-sh/setup-bun@v2

      # Setup
      - name: Setup package
        run: bun setup

      # Build
      - name: Build
        run: bun run build

      # Publish
      - name: Publish
        run: bun run publish
