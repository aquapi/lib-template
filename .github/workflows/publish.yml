name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*' # semver tag

permissions:
  id-token: write
  contents: read

jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup node
      - uses: actions/setup-node@v4
        with:
          version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Build
      - name: Build
        run: |
          npm i
          node --run build

      # Publish
      - name: Publish
        run: node --run publish
        working-directory: target/build
